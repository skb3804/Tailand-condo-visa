<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>태국 신규 콘도 매매 & 은퇴 e-비자 마스터 체크리스트</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', 'Noto Sans Thai', 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        .step-card {
            transition: all 0.2s ease-in-out;
        }
        .chevron-icon {
            transition: transform 0.25s ease;
        }
        .expanded .chevron-icon {
            transform: rotate(180deg);
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="text-slate-800 antialiased pb-24">

    <!-- Top Navigation & Progress Header -->
    <header class="bg-white border-b border-slate-200 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 py-3">
            <!-- Top Bar: Main Domain Switcher Tabs + Language Toggle Button -->
            <div class="flex items-center justify-between gap-2 mb-3">
                <div class="flex p-1 bg-slate-100 rounded-xl border border-slate-200">
                    <button id="domain-tab-condo" onclick="switchDomain('condo')" class="py-1.5 px-3.5 rounded-lg text-xs sm:text-sm font-bold transition-all flex items-center justify-center gap-1.5 bg-white text-indigo-700 shadow-sm">
                        <span>🏢</span>
                        <span id="tab-label-condo">Condo</span>
                    </button>
                    <button id="domain-tab-visa" onclick="switchDomain('visa')" class="py-1.5 px-3.5 rounded-lg text-xs sm:text-sm font-semibold transition-all flex items-center justify-center gap-1.5 text-slate-600 hover:text-slate-900">
                        <span>🛂</span>
                        <span id="tab-label-visa">Visa</span>
                    </button>
                </div>

                <!-- Korean <-> Thai Language Toggle Button (For Thai Agents / Bank / Immigration) -->
                <button id="lang-toggle-btn" onclick="toggleLanguage()" class="px-3 py-1.5 rounded-xl border border-amber-300 bg-amber-50 hover:bg-amber-100 text-amber-900 text-xs sm:text-sm font-bold shadow-sm transition-all flex items-center gap-1.5 shrink-0" title="태국 현지 에이전트·은행·이민국 직원에게 보여줄 때 태국어로 전환합니다">
                    <span>🇹🇭</span>
                    <span id="lang-toggle-text">태국어 (ไทย)</span>
                </button>
            </div>

            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2.5">
                <div>
                    <div id="header-badges" class="flex items-center gap-1.5">
                        <span class="px-2 py-0.5 text-[11px] font-bold bg-indigo-100 text-indigo-700 rounded-full">태국 전역 공용</span>
                        <span class="px-2 py-0.5 text-[11px] font-bold bg-emerald-100 text-emerald-700 rounded-full">외국인 Freehold 완전소유</span>
                    </div>
                    <h1 id="header-title" class="text-lg sm:text-2xl font-bold text-slate-900 mt-1">태국 신축콘도 구매 체크리스트</h1>
                    <p id="header-subtitle" class="text-xs sm:text-sm text-slate-500">사전 실사부터 유심·계좌 개설, FET 외화송금, Chanote 명의이전까지 단계별 완벽 가이드</p>
                </div>
                
                <!-- Progress Box -->
                <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 min-w-[210px]">
                    <div class="flex justify-between items-center mb-1.5">
                        <span id="progress-label" class="text-xs font-semibold text-slate-600">현재 탭 진행률</span>
                        <span id="progress-text" class="text-sm font-bold text-indigo-600">0%</span>
                    </div>
                    <div class="w-full bg-slate-200 rounded-full h-2.5 overflow-hidden">
                        <div id="progress-bar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                    </div>
                    <div class="flex justify-between items-center mt-1.5 text-[11px] text-slate-400">
                        <span id="completed-count">0 / 0 완료</span>
                        <div class="space-x-2">
                            <button id="btn-expand-all" onclick="toggleAllAccordions(true)" class="text-indigo-600 hover:underline font-medium">모두펼침</button>
                            <span>·</span>
                            <button id="btn-reset" onclick="resetProgress()" class="text-rose-500 hover:underline font-medium">초기화</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Filter Tabs (Dynamically Rendered per Domain) -->
            <div class="flex gap-2 mt-4 overflow-x-auto pb-1" id="phase-tabs"></div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 sm:px-6 mt-6 space-y-6">

        <!-- Condo Memo Card -->
        <section id="memo-section-condo" class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5">
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
                    <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                    <span id="memo-condo-title">콘도 메모장(자동저장)</span>
                </h2>
                <span class="text-xs text-emerald-600 font-medium save-status-indicator">브라우저 자동 저장됨</span>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 text-sm">
                <div>
                    <label id="label-memo-unit" class="block text-xs font-medium text-slate-500 mb-1">콘도명 & 확정 동/호수</label>
                    <input type="text" id="memo-unit" placeholder="예: Condo Name Unit 1012" class="memo-input w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label id="label-memo-price" class="block text-xs font-medium text-slate-500 mb-1">총 분양가 & 면적</label>
                    <input type="text" id="memo-price" placeholder="예: 3,500,000 THB (35 SQM)" class="memo-input w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label id="label-memo-bank" class="block text-xs font-medium text-slate-500 mb-1">태국 계좌번호 & 은행명</label>
                    <input type="text" id="memo-bank" placeholder="개설 후 은행/계좌/SWIFT 기록" class="memo-input w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label id="label-memo-sim" class="block text-xs font-medium text-slate-500 mb-1">태국 유심 번호 & 만료일</label>
                    <input type="text" id="memo-sim" placeholder="예: 08X-XXX-XXXX (만료일 기록)" class="memo-input w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>
        </section>

        <!-- Visa Memo Card -->
        <section id="memo-section-visa" class="hidden bg-white rounded-2xl border border-slate-200 shadow-sm p-5">
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
                    <svg class="w-5 h-5 text-teal-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.417.835 2.83 2M9 14a3.001 3.001 0 00-2.83 2M15 11h3m-3 4h2"></path></svg>
                    <span id="memo-visa-title">비자 메모장(자동저장)</span>
                </h2>
                <span class="text-xs text-emerald-600 font-medium save-status-indicator">브라우저 자동 저장됨</span>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 text-sm">
                <div>
                    <label id="label-visa-entry" class="block text-xs font-medium text-slate-500 mb-1">태국 입국일 & 90일 만료일</label>
                    <input type="text" id="visa-entry" placeholder="예: 2026-08-20 입국 / 11-17 만료" class="memo-input w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500">
                </div>
                <div>
                    <label id="label-visa-deposit-date" class="block text-xs font-medium text-slate-500 mb-1">80만 바트 입금완료일 (기준일)</label>
                    <input type="text" id="visa-deposit-date" placeholder="입금일 + 60일 후부터 연장가능" class="memo-input w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500">
                </div>
                <div>
                    <label id="label-visa-bank" class="block text-xs font-medium text-slate-500 mb-1">카시콘(또는 개설) 계좌 & SWIFT</label>
                    <input type="text" id="visa-bank" placeholder="예: Kasikorn / KASITHBK" class="memo-input w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500">
                </div>
                <div>
                    <label id="label-visa-imm-date" class="block text-xs font-medium text-slate-500 mb-1">이민국 방문 예정일 & 90일 신고</label>
                    <input type="text" id="visa-imm-date" placeholder="만료 30일 전~만료일 사이 방문" class="memo-input w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500">
                </div>
            </div>
        </section>

        <!-- Instruction Hint -->
        <div id="instruction-hint" class="flex items-center justify-between bg-indigo-50/80 border border-indigo-100 rounded-xl px-4 py-2.5 text-xs sm:text-sm text-indigo-900">
            <div class="flex items-center gap-2">
                <span class="text-base">👇</span>
                <span id="instruction-hint-text">각 항목의 <strong>제목 영역을 클릭하면 펼쳐지면서 상세한 이유, 오류 교정 사항, 실무 팁</strong>을 확인할 수 있습니다.</span>
            </div>
        </div>

        <!-- Checklist Container -->
        <div id="checklist-container" class="space-y-6">
            <!-- Dynamically Rendered Phases -->
        </div>

        <!-- CONDO DOMAIN EXTRA SECTIONS (Dynamically rendered in KO / TH) -->
        <div id="extra-section-condo" class="space-y-6"></div>

        <!-- VISA DOMAIN EXTRA SECTIONS (Dynamically rendered in KO / TH) -->
        <div id="extra-section-visa" class="hidden space-y-6"></div>

    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-lg text-sm font-medium transform translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center gap-2">
        <span class="text-emerald-400">✓</span>
        <span id="toast-msg">복사되었습니다.</span>
    </div>

                let itemsHtml = phase.items.map(item => {
                    const isChecked = !!checkedState[item.id];
                    const isExpanded = !!expandedState[item.id];
                    
                    const displayTag = isTh ? item.tagTh : item.tag;
                    const displayTitle = isTh ? item.titleTh : item.title;
                    const displaySummary = isTh ? item.summaryTh : item.summary;
                    const displayReason = isTh ? item.reasonTh : item.reason;

                    return `
                        <div class="step-card rounded-xl border transition-all ${isChecked ? 'bg-slate-50/70 border-slate-200' : 'bg-white border-slate-200 hover:border-slate-300'} ${isExpanded ? 'ring-1 ring-slate-300 expanded' : ''}">
                            <div class="flex items-start gap-3.5 p-4">
                                <!-- Checkbox Column -->
                                <div class="pt-0.5 shrink-0">
                                    <input type="checkbox" id="${item.id}" ${isChecked ? 'checked' : ''} onchange="toggleItem('${item.id}')" class="w-5 h-5 rounded-md border-slate-300 ${checkboxColor} cursor-pointer">
                                </div>
                                
                                <!-- Clickable Accordion Header Area -->
                                <div onclick="toggleExpand('${item.id}')" class="flex-1 min-w-0 cursor-pointer select-none">
                                    <div class="flex items-start justify-between gap-2">
                                        <div>
                                            <div class="flex flex-wrap items-center gap-2 mb-1">
                                                <span class="px-2 py-0.5 text-[11px] font-bold rounded-md border ${tagStyles[item.tagColor]}">${displayTag}</span>
                                                <h4 class="font-bold text-sm sm:text-base ${isChecked ? 'line-through text-slate-400' : 'text-slate-900'}">${displayTitle}</h4>
                                            </div>
                                            <p class="text-xs sm:text-sm ${isChecked ? 'text-slate-400' : 'text-slate-600'}">${displaySummary}</p>
                                        </div>
                                        <div class="p-1 text-slate-400 hover:text-slate-700 shrink-0 mt-0.5">
                                            <svg class="w-5 h-5 chevron-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                            </svg>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Expanded Detailed Reason Section -->
                            <div class="${isExpanded ? 'block' : 'hidden'} px-4 pb-4 pt-0 pl-12">
                                <div class="p-3.5 rounded-xl ${reasonBg} border text-xs sm:text-sm text-slate-700 leading-relaxed space-y-2">
                                    <div class="font-bold ${reasonTitleColor} flex items-center gap-1.5">
                                        <span>${isTh ? '💡 รายละเอียดสำคัญและข้อควรระวัง' : '💡 핵심 이유 및 실무 주의사항'}</span>
                                    </div>
                                    <p class="font-medium text-slate-800">${displayReason}</p>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                const phaseTitle = (isTh ? phase.titleTh : phase.title) || phase.title;
                const phaseSubtitle = (isTh ? phase.subtitleTh : phase.subtitle) || phase.subtitle;

                section.innerHTML = `
                    <div class="bg-slate-50/90 px-5 py-4 border-b border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                        <div>
                            <div class="flex items-center gap-2">
                                <span class="text-xs font-extrabold tracking-wider ${accentText} uppercase">${phase.badge}</span>
                                <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-white border border-slate-200 text-slate-600">${phaseCompleted} / ${phaseTotal} ${isTh ? 'เสร็จสิ้น' : '완료'}</span>
                            </div>
                            <h3 class="text-lg font-bold text-slate-900 mt-0.5">${phaseTitle}</h3>
                            <p class="text-xs text-slate-500 mt-0.5">${phaseSubtitle}</p>
                        </div>
                    </div>
                    <div class="p-4 sm:p-5 space-y-3">
                        ${itemsHtml}
                    </div>
                `;

                container.appendChild(section);
            });

            updateProgress();
        }

        function toggleItem(id) {
            checkedState[id] = !checkedState[id];
            localStorage.setItem('thaiCondoChecklistState_v3', JSON.stringify(checkedState));
            renderChecklist();
        }

        function toggleExpand(id) {
            expandedState[id] = !expandedState[id];
            localStorage.setItem('thaiCondoExpandedState_v3', JSON.stringify(expandedState));
            renderChecklist();
        }

        function toggleAllAccordions(expand) {
            const currentData = domainConfigs[activeDomain].data;
            currentData.forEach(phase => {
                phase.items.forEach(item => {
                    expandedState[item.id] = expand;
                });
            });
            localStorage.setItem('thaiCondoExpandedState_v3', JSON.stringify(expandedState));
            renderChecklist();
            showToast(expand ? '현재 탭의 모든 상세 설명을 펼쳤습니다.' : '모든 상세 설명을 접었습니다.');
        }

        function updateProgress() {
            let total = 0;
            let completed = 0;
            const currentData = domainConfigs[activeDomain].data;
            const isTh = currentLang === 'th';

            currentData.forEach(phase => {
                phase.items.forEach(item => {
                    total++;
                    if (checkedState[item.id]) completed++;
                });
            });

            const percent = total === 0 ? 0 : Math.round((completed / total) * 100);
            document.getElementById('progress-bar').style.width = `${percent}%`;
            document.getElementById('progress-text').textContent = `${percent}%`;
            document.getElementById('completed-count').textContent = `${completed} / ${total} ${isTh ? 'เสร็จสิ้น' : '완료'}`;

            if (percent === 100 && total > 0) {
                const msg = activeDomain === 'condo'
                    ? (isTh ? 'เสร็จสมบูรณ์ทุกขั้นตอนแล้ว!' : '축하합니다! 모든 절차가 완료되어 콘도 소유권 등기(Chanote)까지 마쳤습니다!')
                    : (isTh ? 'เสร็จสมบูรณ์ทุกขั้นตอนแล้ว!' : '축하합니다! 태국 은퇴 e-비자 발급부터 현지 1년 연장 절차까지 모두 완료했습니다!');
                showToast(msg);
            }
        }

        function filterPhase(phaseId, btnEl) {
            currentFilter = phaseId;
            renderPhaseTabs();
            renderChecklist();
        }

        function resetProgress() {
            const currentData = domainConfigs[activeDomain].data;
            currentData.forEach(phase => {
                phase.items.forEach(item => {
                    delete checkedState[item.id];
                });
            });
            localStorage.setItem('thaiCondoChecklistState_v3', JSON.stringify(checkedState));
            renderChecklist();
            showToast('현재 탭의 체크리스트 진행 상태가 초기화되었습니다.');
        }

        // Memo Auto-Save Logic (Condo & Visa)
        const memoIds = [
            'memo-unit', 'memo-price', 'memo-bank', 'memo-sim',
            'visa-entry', 'visa-deposit-date', 'visa-bank', 'visa-imm-date'
        ];
        memoIds.forEach(id => {
            const el = document.getElementById(id);
            if (!el) return;
            const savedVal = localStorage.getItem('thaiMaster_v3_' + id);
            if (savedVal) el.value = savedVal;

            el.addEventListener('input', () => {
                localStorage.setItem('thaiMaster_v3_' + id, el.value);
                document.querySelectorAll('.save-status-indicator').forEach(ind => {
                    ind.textContent = '저장 중...';
                    setTimeout(() => {
                        ind.textContent = '브라우저 자동 저장됨';
                    }, 400);
                });

                if (id === 'memo-unit') {
                    const unitVal = el.value.trim() || '[Condo Name Unit No]';
                    document.getElementById('remittance-text').textContent = `To purchase a condominium unit ${unitVal}`;
                }
            });
        });

        // Initial Load
        window.addEventListener('DOMContentLoaded', () => {
            updateLangButtonUI();
            switchDomain(activeDomain);
        });

        // Clipboard Copy Function (iFrame safe)
        function copyTextById(elementId, toastMessage) {
            const text = document.getElementById(elementId).textContent;
            const tempInput = document.createElement('textarea');
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);
            showToast(toastMessage);
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
</body>
</html>
